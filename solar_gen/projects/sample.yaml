# Sample project (fictional data, modelled on the example PWA water-station set).
# Copy this file for a real job and replace the values. Lengths in mm unless noted.

template_dwg: ../../example/1 สถานีผลิตน้ำศูนย์ราชการ 280826.dwg   # relative to this file
fonts_dir: ../../example/font            # SHX fonts (cordia.shx ...) for plotting; copied next to the DXF
output_name: SAMPLE-WTP

project:
